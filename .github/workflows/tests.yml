name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Install Allure CLI
        if: matrix.browser == 'chromium'
        run: |
          curl -o allure.tgz -OLs https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.35.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Run tests
        run: pytest -n 2 --browser ${{ matrix.browser }}

      - name: Generate Allure report
        if: matrix.browser == 'chromium'
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Pages artifact
        if: matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify_success:
    needs: deploy
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{
              "text": "✅ Playwright tests passed!\nAllure report: ${{ needs.deploy.outputs.page_url }}"
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  notify_failure:
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{
              "text": "❌ Playwright tests failed!\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"